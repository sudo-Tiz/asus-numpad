name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8

      - name: Build
        run: go build -ldflags="-s -w" .

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o asus-numpad-linux-amd64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o asus-numpad-linux-arm64
          sha256sum asus-numpad-* > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            asus-numpad-linux-amd64
            asus-numpad-linux-arm64
            checksums.txt
          generate_release_notes: true
