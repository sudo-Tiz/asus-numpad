version: "2"

run:
  timeout: 5m
  go: '1.24'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-blank: false
      check-type-assertions: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os/exec.Cmd).Run
        - syscall.Close
        - syscall.Syscall
        - (github.com/ThomasT75/uinput.Keyboard).KeyDown
        - (github.com/ThomasT75/uinput.Keyboard).KeyUp
        - (github.com/ThomasT75/uinput.Keyboard).Close

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: devices\.go
      linters:
        - errcheck
      text: "Close"
